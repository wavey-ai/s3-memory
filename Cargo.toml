[package]
name = "s3-memory"
version = "0.1.0"
edition = "2021"
description = "In-memory S3-compatible HTTP server for tests"
license = "MIT"

[dependencies]
arc-swap = "1"
bytes = "1.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
md-5 = "0.10"
percent-encoding = "2"
quick-xml = "0.41"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "signal"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
aws-sdk-s3 = { version = ">=1.40.0, <1.68.0", features = ["behavior-version-latest"] }
